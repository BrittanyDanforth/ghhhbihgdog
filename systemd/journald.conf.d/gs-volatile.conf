# The journal stays in RAM, on BOTH boxes (the host-privacy pass).
#
# Every unit in this directory keeps its own output off the journal
# (StandardOutput=null), but systemd itself journals that a unit started and
# stopped, and when -- and the transient `gs-wake-deadman-ext` timer the agent
# arms for a spending job has a length that names the job. On a persistent
# journal (/var/log/journal, the default on most installs) that is a dated
# list of every wake, and of which ones spent, on a disk that unlocks itself
# to boot; on the Pi it is every restart of the pager. Nothing in this repo's
# wipe reaches /var/log/journal.
#
# Storage=volatile keeps the journal under /run only: gone at power-off,
# which for the vault is the end of every wake. Install on the vault AND the
# Pi:
#
#     sudo install -D -m 0644 systemd/journald.conf.d/gs-volatile.conf \
#         /etc/systemd/journald.conf.d/gs-volatile.conf
#     sudo systemctl restart systemd-journald
#
# What this does not do: erase a journal that already exists on disk. Once,
# after installing it:
#
#     sudo journalctl --rotate && sudo journalctl --vacuum-time=1s
#     sudo rm -rf /var/log/journal        # the persistent store, if present
#
# Debugging a boot afterwards means reading the journal BEFORE the box powers
# off (or `journalctl -b` on the Pi, which stays up).
[Journal]
Storage=volatile
